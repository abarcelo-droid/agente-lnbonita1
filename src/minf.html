<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2540">
<title>La Niña Bonita - Informes</title>

<!-- PWA. Mismo patrón que /m/ifco y /scout: una app propia, instalable, no el panel
     achicado. panel.html pesa 3,6 MB y por datos móviles es inusable. -->
<link rel="manifest" href="/manifest-minf.json">
<link rel="icon" type="image/png" sizes="32x32" href="/mifco-icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/mifco-icon-apple.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LNB Informes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f0f4f8;--sur:#fff;--bor:#dde3ea;--bor2:#c8d2db;
  --txt:#1a2332;--mut:#5a6a7e;--sub:#8a9bb0;
  --burg:#1a3a5c;--burd:#0f2540;--burl:#e8f0f8;
  --ok:#16a34a;--warn:#d97706;--err:#dc2626;
  --verde:#2f7a4d;--verdel:#c3ddcd;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--txt);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100vh}
body{padding-bottom:calc(24px + env(safe-area-inset-bottom))}

.hd{position:sticky;top:0;background:var(--burd);color:#fff;padding:12px 14px;
  display:flex;align-items:center;gap:10px;z-index:20;
  padding-top:calc(12px + env(safe-area-inset-top))}
.hd .tit{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .tit small{display:block;font-size:11px;opacity:.72;font-weight:400;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd button{background:transparent;border:1px solid rgba(255,255,255,.25);color:#fff;
  font-size:12px;padding:6px 10px;border-radius:8px;font-family:var(--sans);flex-shrink:0}
.hd .atras{border:0;font-size:22px;padding:2px 8px 6px;line-height:1}

.wrap{max-width:560px;margin:0 auto;padding:13px 13px 30px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.kpi{background:var(--sur);border-radius:12px;padding:12px 13px;border:1px solid var(--bor)}
.kpi .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .v{font-size:23px;font-weight:700;line-height:1.15;margin-top:2px}
.kpi .s{font-size:11.5px;color:var(--mut);margin-top:1px}
.kpi.ancha{grid-column:1/-1}

/* La botonera. Botones grandes: se tocan con el pulgar, sin apuntar. */
.menu{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-bottom:14px}
.menu button{background:var(--sur);border:1px solid var(--bor);border-radius:12px;
  padding:14px 6px;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--txt);
  display:flex;flex-direction:column;align-items:center;gap:5px;line-height:1.15}
.menu button:active{background:var(--burl)}
.menu button .ic{font-size:21px}
.menu button small{font-size:10px;font-weight:400;color:var(--mut)}

.sec{background:var(--sur);border-radius:12px;border:1px solid var(--bor);margin-bottom:13px;overflow:hidden}
.sec > h2{font-size:13px;font-weight:700;padding:12px 14px 8px;display:flex;
  align-items:baseline;gap:8px}
.sec > h2 small{font-size:11px;font-weight:400;color:var(--mut)}

/* Cada fila es un botón: la app entera se navega tocando. La flecha lo dice — sin ella,
   nadie descubre que se puede entrar. */
.fila{display:flex;align-items:center;gap:9px;padding:11px 13px;border-top:1px solid var(--bor);
  width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0;
  font-family:var(--sans);text-align:left;color:var(--txt)}
.fila:active{background:var(--burl)}
.fila .nom{flex:1;min-width:0;font-size:13.5px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .nom small{display:block;font-size:11px;font-weight:400;color:var(--mut);
  white-space:normal}
.fila .num{font-size:13.5px;font-weight:700;text-align:right;white-space:nowrap}
.fila .num small{display:block;font-size:11px;font-weight:600}
.fila .fl{color:var(--sub);font-size:17px;flex-shrink:0;line-height:1}
.vacio{padding:16px 14px;color:var(--mut);font-size:13px;border-top:1px solid var(--bor)}

.sube{color:var(--ok)} .baja{color:var(--err)}
.chip{display:inline-block;padding:2px 7px;border-radius:9px;font-size:10.5px;font-weight:700}
.c-rojo{background:#fee2e2;color:#991b1b} .c-ambar{background:#fef3c7;color:#92400e}
.c-azul{background:#dbeafe;color:#1e40af} .c-verde{background:#dcfce7;color:#166534}
.c-gris{background:#f1f5f9;color:#64748b}

/* Por qué dimensión abrir la lista. Chips y no un <select>: se ve qué opciones hay sin
   desplegar nada. */
.dims{display:flex;gap:6px;overflow-x:auto;padding:0 13px 11px;margin:0 -13px}
.dims button{flex-shrink:0;background:var(--sur);border:1px solid var(--bor2);border-radius:20px;
  padding:7px 13px;font-family:var(--sans);font-size:12.5px;color:var(--mut)}
.dims button.on{background:var(--burg);border-color:var(--burg);color:#fff;font-weight:600}

.ruta{font-size:11.5px;color:var(--mut);margin-bottom:11px;line-height:1.45}
.ruta b{color:var(--txt)}
.graf{padding:4px 13px 12px}
.aviso{padding:10px 12px;border-radius:10px;background:#fef3c7;border:1px solid #fcd34d;
  color:#92400e;font-size:12px;margin-bottom:12px}
.sel{display:flex;gap:8px;margin-bottom:12px}
.sel select,.busca input{width:100%;padding:10px 11px;border-radius:10px;border:1px solid var(--bor2);
  background:var(--sur);font-family:var(--sans);font-size:14px;color:var(--txt)}
.sel select{flex:1;min-width:0}
.busca{margin-bottom:11px}
.pie{font-size:11px;color:var(--sub);text-align:center;margin-top:8px}
.pie a{color:var(--burg)}
.cargando{padding:30px 14px;text-align:center;color:var(--mut);font-size:14px}
/* VENTANAS. Cada productor es una FICHA y no un renglón: doce meses apretados en 88px entre
   el nombre y el número no se leen en un teléfono — que es lo que había antes. Acá la franja
   ocupa todo el ancho, así cada mes tiene unos 27px y se distingue.
   La grilla de los meses y la de las barras son la MISMA, así que el rótulo de arriba cae
   exactamente sobre su columna: sin eso, una barra alta no dice en qué mes está. */
.vmeses{display:grid;gap:2px;padding:2px 13px 7px;font-size:9.5px;color:var(--sub);
  text-align:center;font-weight:700;letter-spacing:.02em}
.vcard{display:block;width:100%;padding:11px 13px 12px;border:0;border-top:1px solid var(--bor);
  background:transparent;font-family:var(--sans);text-align:left;color:var(--txt)}
.vcard:active{background:var(--burl)}
.vtop{display:flex;align-items:baseline;gap:8px}
.vtop .n{flex:1;min-width:0;font-size:14px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vtop .k{font-size:12.5px;font-weight:700;white-space:nowrap}
.vsub{font-size:11.5px;color:var(--mut);margin:1px 0 7px}
.vbar{display:grid;gap:2px;align-items:end;height:28px}
.vbar i{background:var(--verdel);border-radius:2px 2px 0 0;min-height:2px;display:block}
.vbar i.on{background:var(--verde)}
.vnota{font-size:11.5px;margin-top:7px;font-weight:600}
</style>
</head>
<body>

<div class="hd">
  <button class="atras" id="btn-atras" onclick="volver()" style="display:none">‹</button>
  <div class="tit" id="hd-tit">Informes comerciales<small id="hd-sub">cargando…</small></div>
  <button id="btn-salir" onclick="salir()">Salir</button>
</div>

<div class="wrap">
  <div id="cuerpo"><div class="cargando">Buscando los números…</div></div>
  <div class="pie">
    Datos al <span id="pie-sync">—</span>.<br>
    <a href="/panel">Ver el informe completo en la computadora</a>
  </div>
</div>

<script>
// ── INFORMES COMERCIALES, VERSIÓN TELÉFONO ────────────────────────────────────────────
// Una app NAVEGABLE, no una pantalla que se lee. Arranca en la facturación y los kilos del
// mes contra el año pasado, y de ahí se entra: tocás CENCOSUD y ves qué le vendimos, tocás
// un producto y ves de quién vino. Todo es un botón.
//
// NO ES EL PANEL ACHICADO. panel.html pesa 3,6 MB —por datos móviles es inusable— y su tabla
// de doce columnas no se lee en un teléfono. Es el mismo patrón que /m/ifco y /scout: una app
// propia, instalable, contra los MISMOS endpoints. Eso último importa más de lo que parece:
// el nivel que decide quién ve margen lo decide el servidor, así que no hay una segunda
// versión de la verdad que mantener.
//
// ── LA NAVEGACIÓN ─────────────────────────────────────────────────────────────────────
// Una PILA de pantallas, y cada empujón hace un history.pushState. Sin eso, el botón "atrás"
// del teléfono —que es el que la gente usa, no el de la app— cerraría la aplicación en vez de
// volver un paso, y eso se siente roto aunque todo lo demás ande.
var S = {
  user:null, ventana:null, sync:null,
  pila:[],            // el camino recorrido
  opts:null,          // dimensiones y productos, se piden una vez
};

var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
var nr = function(n){ return Number(n||0).toLocaleString('es-AR'); };
var nrDec = function(n,d){ return Number(n||0).toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d}); };
// La unidad va pegada al número, igual que en el panel: una fila suelta tiene que decir sola
// de qué habla.
var usd = function(n){ return n==null ? '—' : ('USD '+nr(n)); };
var kg  = function(n){ return n==null ? '—' : (nr(n)+' K'); };
var mesTxt = function(m){ var x=/^\d\d-(.+)$/.exec(String(m||'')); return x?x[1]:String(m||''); };
var camp = function(p){ var m=/^(\d{2})(\d{2})-(\d{2})(\d{2})$/.exec(String(p||'')); return m?(m[2]+'/'+m[4]):String(p||''); };

async function api(url){
  var r = await fetch(url, { credentials:'include' });
  if (r.status === 401) { window.location.href = '/login?next=/m/informes'; return null; }
  var d = await r.json();
  if (!d || !d.ok) throw new Error((d && d.error) || ('HTTP ' + r.status));
  return d.data;
}
function salir(){
  fetch('/api/auth/logout', { method:'POST', credentials:'include' })
    .finally(function(){ window.location.href = '/login'; });
}
function cargando(txt){ $('cuerpo').innerHTML = '<div class="cargando">'+(txt||'Buscando…')+'</div>'; }
function error(e){ $('cuerpo').innerHTML = '<div class="cargando" style="color:var(--err)">'+esc(e.message||e)+'</div>'; }

// ── LA PILA ───────────────────────────────────────────────────────────────────────────
function ir(pantalla, args, titulo, sub){
  S.pila.push({ p:pantalla, a:args||{}, t:titulo, s:sub });
  history.pushState({ n:S.pila.length }, '', '#'+pantalla);
  render();
}
function volver(){ history.back(); }
window.addEventListener('popstate', function(){
  if (S.pila.length > 1) { S.pila.pop(); render(); }
});

function render(){
  var e = S.pila[S.pila.length-1];
  if (!e) return;
  $('hd-tit').childNodes[0].nodeValue = e.t || 'Informes comerciales';
  $('hd-sub').textContent = e.s || '';
  $('btn-atras').style.display = S.pila.length > 1 ? 'block' : 'none';
  $('btn-salir').style.display = S.pila.length > 1 ? 'none' : 'block';
  window.scrollTo(0,0);
  PANTALLAS[e.p](e.a);
}

// Los filtros puestos, para armar la URL y para mostrar el camino.
function qs(a, extra){
  var p = [];
  if (S.ventana) {
    if (a.mes || S.ventana.mes)   p.push('mes_ok='+encodeURIComponent(a.mes||S.ventana.mes));
    if (a.camp || S.ventana.actual) p.push('periodo_actual='+encodeURIComponent(a.camp||S.ventana.actual));
  }
  var f = a.filtros || {};
  for (var k in f) if (f[k]) p.push('filtro_'+k+'='+encodeURIComponent(f[k]));
  return p.concat(extra||[]).join('&');
}
// El camino recorrido, escrito. En una pantalla chica, sin esto no se sabe si el número que
// se está mirando es de todo o de un cliente.
function ruta(filtros){
  var ks = Object.keys(filtros||{}).filter(function(k){ return filtros[k]; });
  if (!ks.length) return '';
  return '<div class="ruta">Mirando sólo: '
    + ks.map(function(k){ return '<b>'+esc(filtros[k])+'</b>'; }).join(' · ') + '</div>';
}

var DIM_LABEL = { cliente:'Cliente', producto:'Producto', articulo:'Artículo',
  categoria:'Categoría', subcategoria:'Subcategoría', vendedor:'Vendedor',
  proveedor:'Proveedor', cate_clie:'Rubro' };
// Al entrar a algo, por qué abrirlo. Un cliente se abre por producto y un producto por
// cliente: es lo que se pregunta el 90% de las veces, y las otras están en los chips.
var DIM_SIGUIENTE = { cliente:'producto', producto:'cliente', articulo:'cliente',
  categoria:'producto', subcategoria:'producto', vendedor:'cliente', proveedor:'producto',
  cate_clie:'cliente' };

var PANTALLAS = {};

// ══ INICIO ════════════════════════════════════════════════════════════════════════════
PANTALLAS.inicio = async function(){
  cargando();
  try {
    var d = await api('/api/informes/interanual?agrupar=cliente&'+qs({}));
    if (!d) return;
    S.ventana = d.ventana; S.sync = d.sync;
    $('pie-sync').textContent = (d.sync && d.sync.ultimo_ok) || '—';
    var v = d.ventana||{}, R = d.resumen||{}, A = R.actual||{}, B = R.anterior||{};

    // EL NÚMERO GRANDE ES EL TOTAL; la variación va abajo y chica. Al revés —el % arriba— se
    // lee primero el cambio y después el tamaño, y lo que se viene a ver es cuánto se
    // facturó. La comparación es contexto, no el titular.
    var pctTxt = function(x, sufijo){
      if (x == null) return '<span style="color:var(--mut)">sin comparación</span>';
      return '<span class="'+(x>=0?'sube':'baja')+'">'+(x>=0?'▲ ':'▼ ')+nrDec(Math.abs(x),1)+'%</span>'
        + (sufijo ? ('<span style="color:var(--mut)"> '+sufijo+'</span>') : '');
    };
    var kpi = function(l,val,sub,ancha){
      return '<div class="kpi'+(ancha?' ancha':'')+'"><div class="l">'+l+'</div>'
        + '<div class="v">'+val+'</div><div class="s">'+(sub||'')+'</div></div>'; };

    var h = '';
    if (v.en_curso) {
      h += '<div class="aviso">⚠ <b>'+esc(mesTxt(v.mes))+' de '+esc(v.actual)+' está a medio facturar</b> '
        + 'y se compara contra el mes entero de '+esc(v.anterior)+'. Si todo baja parejo, mirá primero el mes anterior.</div>';
    }
    h += '<div class="sel">'
      + '<select onchange="S.ventana.mes=this.value;render()">'
      + (v.meses||[]).map(function(x){ return '<option value="'+esc(x)+'"'+(x===v.mes?' selected':'')+'>'+esc(mesTxt(x))+'</option>'; }).join('')
      + '</select>'
      + '<select onchange="S.ventana.actual=this.value;render()">'
      + (v.periodos||[]).map(function(x){ return '<option value="'+esc(x)+'"'+(x===v.actual?' selected':'')+'>'+esc(x)+'</option>'; }).join('')
      + '</select></div>';

    // Los totales del mes, grandes, con la comparación abajo en chico.
    var contra = 'vs ' + camp(v.anterior);
    h += '<div class="kpis">'
      + kpi('Facturación de '+esc(mesTxt(v.mes)), usd(A.usd||0),
          pctTxt(R.var_usd_pct, contra) + ' · antes ' + usd(B.usd||0))
      + kpi('Kilos de '+esc(mesTxt(v.mes)), kg(A.kilos||0),
          pctTxt(R.var_kilos_pct, contra) + ' · antes ' + kg(B.kilos||0));

    // La rentabilidad, si el nivel alcanza. El servidor decide: si no puede verla, no viene
    // en la respuesta y acá no se dibuja. Una sola regla, la del panel.
    if (d.ve_margen && A.rent_pct != null) {
      // Dos porcentajes se comparan en PUNTOS, no en porcentaje del porcentaje: pasar de 6% a
      // 7% es "un punto más", y decir "+16,7%" sería cierto y no lo entendería nadie.
      var pts = (B.rent_pct != null) ? (Math.round((A.rent_pct - B.rent_pct)*10)/10) : null;
      h += kpi('Rentabilidad', nrDec(A.rent_pct,1)+'%',
        usd(A.rent_dol||0)
        + (pts != null
            ? (' · <span class="'+(pts>=0?'sube':'baja')+'">'+(pts>=0?'▲ ':'▼ ')+nrDec(Math.abs(pts),1)
               +' pts</span><span style="color:var(--mut)"> '+contra+' ('+nrDec(B.rent_pct,1)+'%)</span>')
            : ''),
        true);
    }
    h += '</div>';

    // La botonera.
    h += '<div class="menu">'
      + '<button onclick="ir(\'lista\',{agrupar:\'cliente\',filtros:{}},\'Interanual\',\'por cliente\')">'
        + '<span class="ic">📈</span>Interanual<small>quién sube y baja</small></button>'
      + '<button onclick="ir(\'oport\',{},\'Oportunidades\',\'qué hay para hacer\')">'
        + '<span class="ic">🎯</span>Oportunidades<small>a quién llamar</small></button>'
      + '<button onclick="ir(\'productos\',{},\'Ventanas\',\'elegí un producto\')">'
        + '<span class="ic">🪟</span>Ventanas<small>quién nos trae</small></button>'
      + '</div>';

    // Un adelanto de lo que más se movió, ya tocable: para el que abre la app y no quiere
    // elegir nada.
    var imp = function(f){ return f.impacto!=null ? f.impacto : ((f.usd_act||0)-(f.usd_ant||0)); };
    var top = (d.filas||[]).slice().sort(function(a,b){ return Math.abs(imp(b))-Math.abs(imp(a)); }).slice(0,5);
    if (top.length) {
      h += '<div class="sec"><h2>Lo que más se movió <small>tocá para ver el detalle</small></h2>'
        + top.map(function(f){ return filaClave(f, 'cliente', {}); }).join('') + '</div>';
    }
    $('cuerpo').innerHTML = h;
    $('pie-sync').textContent = (d.sync && d.sync.ultimo_ok) || '—';
  } catch(e){ error(e); }
};

// Una fila de la lista interanual, tocable.
function filaClave(f, dim, filtros){
  var imp = f.impacto!=null ? f.impacto : ((f.usd_act||0)-(f.usd_ant||0));
  var sg = imp>=0 ? 'sube' : 'baja';
  var chip = f.estado==='perdido' ? '<span class="chip c-rojo">perdido</span> '
           : f.estado==='nuevo'   ? '<span class="chip c-azul">nuevo</span> '
           : f.estado==='crece'   ? '<span class="chip c-verde">crece</span> '
           : f.estado==='cae'     ? '<span class="chip c-ambar">cae</span> ' : '';
  var nuevos = Object.assign({}, filtros); nuevos[dim] = f.clave;
  return '<button class="fila" onclick="abrir('+JSON.stringify(JSON.stringify({d:dim,c:f.clave,f:filtros})).replace(/"/g,'&quot;')+')">'
    + '<div class="nom">'+esc(f.clave||'')+'<small>'+chip
      + (f.usd_act!=null?usd(f.usd_act):'no vendió')
      + (f.kilos_act!=null?(' · '+kg(f.kilos_act)):'')+'</small></div>'
    + '<div class="num '+sg+'">'+(imp>=0?'+':'−')+usd(Math.abs(imp))
      + (f.var_usd_pct!=null?('<small class="'+sg+'">'+(f.var_usd_pct>=0?'+':'')+nrDec(f.var_usd_pct,1)+'%</small>'):'')
    + '</div><span class="fl">›</span></button>';
}
// Entrar a una clave: se le agrega su filtro y se abre por la dimensión que sigue.
function abrir(json){
  var x = typeof json === 'string' ? JSON.parse(json) : json;
  if (x.c === '(sin dato)') return;      // no hay filtro que lo separe
  var filtros = Object.assign({}, x.f); filtros[x.d] = x.c;
  ir('lista', { agrupar: DIM_SIGUIENTE[x.d] || 'producto', filtros: filtros },
     x.c, 'por ' + (DIM_LABEL[DIM_SIGUIENTE[x.d]||'producto']||'').toLowerCase());
}

// ══ LISTA (interanual, y todo el drill) ═══════════════════════════════════════════════
PANTALLAS.lista = async function(a){
  cargando();
  try {
    var d = await api('/api/informes/interanual?agrupar='+encodeURIComponent(a.agrupar)+'&'+qs(a));
    if (!d) return;
    var v = d.ventana||{}, R = d.resumen||{}, A = R.actual||{}, B = R.anterior||{};
    var h = ruta(a.filtros);

    // El total de lo que se está mirando, arriba: sin esto no se sabe si las filas son todo
    // o una parte.
    h += '<div class="kpis">'
      + '<div class="kpi ancha"><div class="l">'+esc(mesTxt(v.mes))+' '+esc(v.actual)+'</div>'
      + '<div class="v">'+usd(A.usd||0)+'</div>'
      + '<div class="s">'+kg(A.kilos||0)+' · antes '+usd(B.usd||0)
      + (R.var_usd_pct!=null?(' <span class="'+(R.var_usd_pct>=0?'sube':'baja')+'">'
          +(R.var_usd_pct>=0?'▲ ':'▼ ')+nrDec(Math.abs(R.var_usd_pct),1)+'%</span>'):'')
      + '</div></div></div>';

    // Por qué dimensión abrir. Sin esto, el camino sería siempre el mismo.
    h += '<div class="dims">' + ['cliente','producto','articulo','categoria','vendedor','proveedor']
      .filter(function(k){ return !(a.filtros||{})[k]; })
      .map(function(k){
        return '<button class="'+(k===a.agrupar?'on':'')+'" onclick="reAgrupar(\''+k+'\')">'+esc(DIM_LABEL[k])+'</button>'; })
      .join('') + '</div>';

    var filas = d.filas||[];
    h += '<div class="sec"><h2>'+nr(filas.length)+' '+esc((DIM_LABEL[a.agrupar]||'').toLowerCase())+'(s) '
      + '<small>ordenados por cuánto movieron</small></h2>'
      + (filas.length
          ? filas.slice(0,60).map(function(f){ return filaClave(f, a.agrupar, a.filtros||{}); }).join('')
          : '<div class="vacio">No hay ventas con esos filtros.</div>')
      + '</div>';
    if (filas.length > 60) h += '<div class="pie">Se muestran los 60 de mayor impacto.</div>';
    $('cuerpo').innerHTML = h;
  } catch(e){ error(e); }
};
function reAgrupar(dim){
  var e = S.pila[S.pila.length-1];
  e.a.agrupar = dim;
  e.s = 'por ' + (DIM_LABEL[dim]||'').toLowerCase();
  render();
}

// ══ OPORTUNIDADES ═════════════════════════════════════════════════════════════════════
PANTALLAS.oport = async function(a){
  cargando('Buscando oportunidades…');
  try {
    var d = await api('/api/informes/oportunidades?limite=40&'+qs(a));
    if (!d) return;
    var h = ruta(a.filtros);
    h += '<div class="kpis"><div class="kpi ancha"><div class="l">Oportunidades</div>'
      + '<div class="v">'+nr(d.total||0)+'</div><div class="s">'
      + (d.ve_margen ? (usd(d.margen_en_juego_total||0)+' de margen sobre la mesa')
                     : 'ordenadas por la plata en juego')
      + '</div></div></div>';
    var items = d.items||[];
    h += '<div class="sec"><h2>Las más grandes <small>tocá para ver el detalle</small></h2>'
      + (items.length ? items.map(function(x){
          var def = (d.tipos||{})[x.tipo] || { label:x.tipo, color:'' };
          var cls = def.color==='rojo' ? 'c-rojo' : (def.color==='azul' ? 'c-azul' : 'c-ambar');
          return '<button class="fila" onclick="abrirOport('
            + JSON.stringify(JSON.stringify(x)).replace(/"/g,'&quot;')+','
            + JSON.stringify(JSON.stringify(def)).replace(/"/g,'&quot;')+')">'
            + '<div class="nom"><span class="chip '+cls+'">'+esc(def.label)+'</span> '+esc(x.titulo||'')
              + '<small>'+esc(x.detalle?(x.detalle+' — '):'')+esc(x.regla||'')+'</small></div>'
            + '<div class="num">'+usd(d.ve_margen ? x.margen_en_juego : x.usd_en_juego)+'</div>'
            + '<span class="fl">›</span></button>';
        }).join('') : '<div class="vacio">No hay oportunidades con esos filtros. Puede ser buena noticia.</div>')
      + '</div>';
    $('cuerpo').innerHTML = h;
  } catch(e){ error(e); }
};
// Tocar una oportunidad entra al cliente con su filtro puesto: la lista es para decidir a
// quién ir, y lo que sigue es ver qué pasa con ese cliente.
function abrirOport(sx, sdef){
  var x = JSON.parse(sx), def = JSON.parse(sdef);
  ir('oportDet', { item:x, def:def }, x.titulo || 'Oportunidad', def.label || '');
}
PANTALLAS.oportDet = function(a){
  var x = a.item, def = a.def;
  var cls = def.color==='rojo' ? 'c-rojo' : (def.color==='azul' ? 'c-azul' : 'c-ambar');
  var h = '<div class="sec"><h2><span class="chip '+cls+'">'+esc(def.label)+'</span></h2>'
    + '<div class="fila" style="border-top:1px solid var(--bor)"><div class="nom">'+esc(x.titulo||'')
      + (x.detalle?('<small>'+esc(x.detalle)+'</small>'):'')+'</div>'
      + '<div class="num">'+usd(x.margen_en_juego!=null ? x.margen_en_juego : x.usd_en_juego)
      + (x.margen_en_juego!=null?'<small style="color:var(--mut);font-weight:400">de margen</small>':'<small style="color:var(--mut);font-weight:400">en juego</small>')
      + '</div></div>'
    + '<div class="vacio" style="color:var(--txt)">'+esc(x.regla||'')+'</div>'
    + '</div>';
  // El botón que sigue: ir a ver a ese cliente.
  var f = x.filtro || {};
  if (f.cliente) {
    h += '<div class="menu" style="grid-template-columns:1fr">'
      + '<button onclick="abrir('+JSON.stringify(JSON.stringify({d:'cliente',c:f.cliente,f:{}})).replace(/"/g,'&quot;')+')">'
      + '<span class="ic">🔎</span>Ver qué le vendemos a '+esc(f.cliente)+'</button></div>';
  }
  if (f.producto) {
    h += '<div class="menu" style="grid-template-columns:1fr">'
      + '<button onclick="ir(\'ventana\',{producto:'+JSON.stringify(JSON.stringify(f.producto)).replace(/"/g,'&quot;')+'},'
      + JSON.stringify(JSON.stringify(f.producto)).replace(/"/g,'&quot;')+',\'quién nos lo trae\')">'
      + '<span class="ic">🪟</span>Quién nos trae '+esc(f.producto)+'</button></div>';
  }
  $('cuerpo').innerHTML = h;
};

// ══ VENTANAS ══════════════════════════════════════════════════════════════════════════
PANTALLAS.productos = async function(){
  cargando('Buscando los productos…');
  try {
    var d = await api('/api/informes/ventanas?sugerencias=40');
    if (!d) return;
    var ps = d.productos||[];
    var h = '<div class="busca"><input id="q" type="search" placeholder="Buscar un producto…" oninput="filtrarProd()"></div>'
      + '<div class="sec"><h2>Los que más se venden <small>tocá uno</small></h2>'
      + '<div id="lista-prod">'
      + ps.map(function(x,i){
          return '<button class="fila prod" data-n="'+esc(String(x.producto).toUpperCase())+'" onclick="verVentana('
            + JSON.stringify(JSON.stringify(x.producto)).replace(/"/g,'&quot;')+')">'
            + '<div class="nom">'+esc(x.producto)+'<small>'+nr(x.campanias)+' campañas · '+nr(x.proveedores)+' productores</small></div>'
            + '<div class="num">'+kg(x.kilos)+'</div><span class="fl">›</span></button>'; }).join('')
      + '</div></div>';
    $('cuerpo').innerHTML = h;
  } catch(e){ error(e); }
};
function filtrarProd(){
  var q = ($('q').value||'').toUpperCase();
  var els = document.querySelectorAll('#lista-prod .prod');
  for (var i=0;i<els.length;i++){
    els[i].style.display = els[i].getAttribute('data-n').indexOf(q) >= 0 ? '' : 'none';
  }
}
function verVentana(sp){ var p = JSON.parse(sp); ir('ventana', { producto:p }, p, 'quién nos lo trae'); }

PANTALLAS.ventana = async function(a){
  cargando('Buscando quién nos lo trae…');
  try {
    var d = await api('/api/informes/ventanas?producto='+encodeURIComponent(a.producto));
    if (!d) return;
    if (d.sin_producto) { $('cuerpo').innerHTML = '<div class="vacio">Elegí un producto.</div>'; return; }
    var meses = d.meses||[], max = d.max_celda_prom||1;
    var h = '<div class="kpis">'
      + '<div class="kpi"><div class="l">A contactar</div><div class="v" style="color:'
        + (d.a_contactar?'#92400e':'#166534')+'">'+nr(d.a_contactar||0)+'</div>'
        + '<div class="s">'+(d.a_contactar?kg(d.kilos_a_contactar)+' por campaña':'están todos')+'</div></div>'
      + '<div class="kpi"><div class="l">Trayendo</div><div class="v">'+nr(d.proveedores_activos||0)+'</div>'
        + '<div class="s">'+kg(d.kilos_act)+' en '+esc(d.periodo_actual)+'</div></div>'
      + '</div>';
    if (d.sin_identificar) {
      h += '<div class="aviso">⚠ <b>'+kg(d.sin_identificar.kilos_hist)+' ('+nrDec(d.sin_identificar.pct_hist,1)
        + '%) sin productor identificado.</b> La columna de proveedor de la planilla trae errores de fórmula.</div>';
    }
    var cols = 'grid-template-columns:repeat('+meses.length+',1fr)';
    h += '<div class="sec"><h2>'+nr((d.filas||[]).length)+' productores '
      + '<small>tocá uno para ver qué nos vende</small></h2>';
    // Los meses, UNA vez y arriba de todas las fichas: la grilla es la misma, así que cada
    // letra cae sobre su columna. Repetirlos en cada ficha sería ruido.
    h += '<div class="vmeses" style="'+cols+'">'
      + meses.map(function(m){ return '<div>'+esc(mesTxt(m).slice(0,1))+'</div>'; }).join('')
      + '</div>';
    h += (d.filas||[]).map(function(f){
      var tocable = !(f.agrupado || f.no_identificado);
      var franja = meses.map(function(m){
        var c = f.por_mes[m]||{};
        var alt = Math.max(2, Math.round(((c.kilos_prom||0)/max)*26));
        var act = (c.kilos_act||0) > 0;
        return '<i class="'+(act?'on':'')+'" style="height:'+alt+'px"'
          + ' title="'+esc(mesTxt(m)+': '+nr(c.kilos_prom||0)+' K de promedio'
              + ((c.kilos_act||0) ? (' · este año '+nr(c.kilos_act)+' K') : ' · este año no trajo'))+'"></i>';
      }).join('');
      var chip = f.contactar ? '<span class="chip c-ambar">☎ llamar</span>'
               : f.esperando ? '<span class="chip c-gris">no le toca aún</span>'
               : f.es_nuevo  ? '<span class="chip c-azul">nuevo</span>'
               : f.no_identificado ? '<span class="chip c-rojo">sin identificar</span>'
               : f.agrupado  ? '<span class="chip c-gris">chicos</span>' : '';
      var nota = f.contactar
          ? '<div class="vnota" style="color:#92400e">☎ hace '+nr(f.campanias_sin_traer||1)+' campaña(s) que no trae'
            + (f.desde ? (' · suele arrancar en <b>'+esc(mesTxt(f.desde).slice(0,3))+'</b>') : '')+'</div>'
        : f.esperando
          ? '<div class="vnota" style="color:var(--mut)">Todavía no le toca · suele arrancar en <b>'
            + esc(mesTxt(f.desde).slice(0,3))+'</b></div>'
        : f.no_identificado
          ? '<div class="vnota" style="color:var(--err)">No son productores: son errores de fórmula de la planilla</div>'
        : '';
      return '<button class="vcard"'+(tocable
          ? (' onclick="abrir('+JSON.stringify(JSON.stringify({d:'proveedor',c:f.proveedor,f:{producto:a.producto}})).replace(/"/g,'&quot;')+')"')
          : ' disabled style="opacity:.75"')+'>'
        + '<div class="vtop"><div class="n">'+esc(f.proveedor)+'</div>'
          + (chip||'') + (tocable?'<span class="fl">›</span>':'') + '</div>'
        + '<div class="vsub">'
          + (f.desde ? ('<b>'+esc(mesTxt(f.desde).slice(0,3))+' → '+esc(mesTxt(f.hasta).slice(0,3))+'</b>') : 'no trajo')
          + ' · ' + kg(f.kilos_prom_anio) + ' por campaña'
          + (f.ultimo_periodo ? (' · último '+esc(camp(f.ultimo_periodo))) : '')
        + '</div>'
        + '<div class="vbar" style="'+cols+'">'+franja+'</div>'
        + nota
        + '</button>';
    }).join('');
    h += '</div>';
    h += '<div class="pie">La barra clara es lo que ese productor trae ese mes en una campaña típica; '
      + 'en <b style="color:var(--verde)">verde fuerte</b>, los meses en que trajo este año. '
      + 'Una clara sin verde es un hueco.</div>';
    $('cuerpo').innerHTML = h;
  } catch(e){ error(e); }
};

// ── ARRANQUE ──────────────────────────────────────────────────────────────────────────
(async function(){
  try {
    var r = await fetch('/api/auth/me', { credentials:'include' });
    if (!r.ok) { window.location.href = '/login?next=/m/informes'; return; }
    var d = await r.json();
    if (!d || !d.ok) { window.location.href = '/login?next=/m/informes'; return; }
    S.user = d.user;
    S.pila = [{ p:'inicio', a:{}, t:'Informes comerciales', s:d.user.nombre||'' }];
    history.replaceState({ n:1 }, '', '#inicio');
    render();
  } catch(e) { error(e); }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('/mifco-sw.js', { scope: '/m/' }).catch(function(){});
  });
}
